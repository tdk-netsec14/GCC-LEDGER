[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gcc-ledger-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "passlib[bcrypt]>=1.7,<2",
  "bcrypt>=4.0",
  "PyJWT>=2.9,<3",
  "httpx>=0.27,<1",
  "APScheduler>=3.10,<4",
  "openai>=1.50,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "hypothesis>=6,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../../tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app/engines"]
