services:
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: sqlite:////var/lib/gcc-ledger/gcc_ledger.db
      VECTOR_INDEX_PATH: /var/lib/gcc-ledger/vector_index
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-development-only-change-me}
      DAILY_LLM_BUDGET_USD: ${DAILY_LLM_BUDGET_USD:-5.00}
      FETCH_USER_AGENT: ${FETCH_USER_AGENT:-GCC-Ledger/0.1}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ledger_data:/var/lib/gcc-ledger
      - ./data:/app/data
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
volumes:
  ledger_data:
