name: GCC Ledger CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]" pytest-cov

      - name: Run Ruff Linter
        run: python -m ruff check apps/api tests/

      - name: Run Mypy Strict Type Checks
        run: python -m mypy --strict apps/api/app/engines

      - name: Run Unit & Contract Tests
        run: |
          export PYTHONPATH="apps/api"
          python -m app.seed
          python -m pytest tests/ --cov=apps/api/app --cov-report=term-missing

      - name: Run AI Grounding Evaluation (60 Questions)
        run: |
          export PYTHONPATH="apps/api"
          export LLM_PROVIDER="mock"
          python -m app.seed
          python eval/run_eval.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm --prefix apps/web ci

      - name: Next.js Type Check & Build
        run: npm --prefix apps/web run build
